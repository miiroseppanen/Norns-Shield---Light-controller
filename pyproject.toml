[project]
name = "shieldxl-light-console"
dynamic = ["version"]
description = "Standalone lighting console UI for Raspberry Pi 4 + Denki Oto shieldXL, using QLC+ as the show engine."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "shieldxl-light-console" }]
dependencies = [
  "PyYAML>=6.0",
]

[project.optional-dependencies]
sim = ["pygame>=2.5"]
dev = ["pytest>=8.0", "pygame>=2.5"]

[project.scripts]
light-console = "light_console.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = {attr = "light_console.version.VERSION"}

[tool.setuptools.packages.find]
include = ["light_console*", "simulator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
